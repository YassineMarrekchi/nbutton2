<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pharmacy Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
  }

  /* ================= BUTTON — angular, panel-style ================= */
  .pharma-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 17px 36px 17px 20px;
    background: #ffffff;
    border: 3px solid #000000;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    cursor: pointer;
    box-shadow: 6px 6px 0 #000000;
    overflow: hidden;
    transition: transform .14s cubic-bezier(.2,.9,.3,1.3), box-shadow .14s cubic-bezier(.2,.9,.3,1.3);
  }
  .pharma-btn:hover {
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 #000000;
  }
  .pharma-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #000000;
  }

  /* diagonal slash that snaps across the button on hover-in, like a menu-select flash */
  .pharma-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: #000000;
    transform: skewX(-20deg);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
  }
  .pharma-btn:hover::before {
    animation: slash .38s cubic-bezier(.2,.7,.2,1) 1;
  }
  @keyframes slash {
    0%   { left: -60%; opacity: .9; }
    60%  { opacity: .9; }
    100% { left: 130%; opacity: 0; }
  }

  .btn-label {
    position: relative;
    z-index: 3;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #000000;
    transition: transform .12s ease;
  }
  .pharma-btn:hover .btn-label {
    animation: label-snap .3s steps(2, jump-none) 1;
  }
  @keyframes label-snap {
    0%   { transform: translateX(0); }
    30%  { transform: translateX(2px); }
    60%  { transform: translateX(-1px); }
    100% { transform: translateX(0); }
  }

  /* ================= FLASK ================= */
  .tube-wrap {
    position: relative;
    z-index: 3;
    width: 34px;
    height: 42px;
    flex-shrink: 0;
    transition: transform .3s cubic-bezier(.34,1.7,.5,1);
  }
  .pharma-btn:hover .tube-wrap {
    transform: scale(1.14) rotate(-6deg);
  }
  .tube-svg { width: 100%; height: 100%; overflow: visible; }

  .pharma-btn:hover .wave-1 { animation: wave-move .55s ease-in-out infinite; }
  .pharma-btn:hover .wave-2 { animation: wave-move .55s ease-in-out infinite reverse; animation-delay: .12s; }
  @keyframes wave-move {
    0%, 100% { transform: translateX(0) translateY(0); }
    50%      { transform: translateX(-1.8px) translateY(-1.4px); }
  }

  .in-bubble { opacity: 0; }
  .pharma-btn:hover .in-bubble {
    animation: rise-in .8s ease-in infinite;
  }
  .ib1 { animation-delay: 0s !important; }
  .ib2 { animation-delay: .18s !important; }
  .ib3 { animation-delay: .36s !important; }
  .ib4 { animation-delay: .09s !important; }
  @keyframes rise-in {
    0%   { opacity: 0; transform: translateY(0) scale(.6); }
    15%  { opacity: 1; }
    80%  { opacity: .7; }
    100% { opacity: 0; transform: translateY(-22px) scale(1); }
  }

  .liquid-body {
    transition: transform .18s ease;
    transform: translateY(2px);
  }
  .pharma-btn:hover .liquid-body {
    transform: translateY(0px);
  }

  /* ================= BUBBLES INSIDE THE BUTTON ================= */
  .bg-bubble {
    position: absolute;
    border: 2px solid #000000;
    border-radius: 50%;
    background: transparent;
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }
  .pharma-btn:hover .bg-bubble {
    animation-name: float-up;
    animation-timing-function: ease-out;
    animation-iteration-count: infinite;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translateY(10px) scale(.5); }
    20%  { opacity: .5; }
    70%  { opacity: .35; }
    100% { opacity: 0; transform: translateY(-46px) scale(1.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-bubble, .in-bubble, .wave-1, .wave-2, .tube-wrap, .liquid-body, .btn-label, .pharma-btn::before {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <button class="pharma-btn" type="button" onclick="navigate()">

    <!-- ambient bubbles, contained inside the button by overflow:hidden -->
    <span class="bg-bubble" style="width:10px; height:10px; left:34%; bottom:6px;  animation-duration:1.3s; animation-delay:0s;"></span>
    <span class="bg-bubble" style="width:7px;  height:7px;  left:52%; bottom:2px;  animation-duration:1.1s; animation-delay:.2s;"></span>
    <span class="bg-bubble" style="width:13px; height:13px; left:68%; bottom:10px; animation-duration:1.5s; animation-delay:.4s;"></span>
    <span class="bg-bubble" style="width:8px;  height:8px;  left:80%; bottom:4px;  animation-duration:1.2s; animation-delay:.3s;"></span>
    <span class="bg-bubble" style="width:6px;  height:6px;  left:45%; bottom:14px; animation-duration:1s;   animation-delay:.55s;"></span>

    <span class="tube-wrap">
      <svg class="tube-svg" viewBox="0 0 34 46" fill="none">
        <clipPath id="tubeClip">
          <path d="M14 2 H20 V14 L28.5 40 Q29.5 45 25 45 H9 Q4.5 45 5.5 40 L14 14 Z"/>
        </clipPath>

        <!-- conical (Erlenmeyer) flask outline -->
        <path d="M14 2 H20 V14 L28.5 40 Q29.5 45 25 45 H9 Q4.5 45 5.5 40 L14 14 Z"
              fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
        <!-- neck rim -->
        <rect x="13" y="0.5" width="8" height="3" rx="1" fill="#000000"/>

        <!-- liquid + bubbles, clipped to flask shape -->
        <g clip-path="url(#tubeClip)">
          <rect class="liquid-body" x="3" y="26" width="28" height="20" fill="#000000"/>
          <path class="wave wave-1 liquid-body" d="M3 26 Q9 23 15 26 T27 26 T33 26 V28 H3 Z" fill="#000000"/>
          <path class="wave wave-2 liquid-body" d="M3 27 Q9 29.5 15 27 T27 27 T33 27 V29 H3 Z" fill="#1a1a1a"/>

          <circle class="in-bubble ib1" cx="11" cy="38" r="1.6" fill="#ffffff"/>
          <circle class="in-bubble ib2" cx="20" cy="40" r="1.3" fill="#ffffff"/>
          <circle class="in-bubble ib3" cx="16" cy="42" r="1.1" fill="#ffffff"/>
          <circle class="in-bubble ib4" cx="23" cy="37" r="1"   fill="#ffffff"/>
        </g>
      </svg>
    </span>

    <span class="btn-label">Consulter mon CV</span>
  </button>

  <script>
    function navigate() {
      window.open("https://drive.google.com/file/d/1cwOqSbf20p5h1Ubpi1tURgOVUT4GF26c/view", '_blank').focus();
    }
  </script>

</body>
</html>
