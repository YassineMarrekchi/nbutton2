<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    padding: 40px 16px;
  }

  .contact-panel {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border: 3px solid #000000;
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    box-shadow: 8px 8px 0 #000000;
    padding: 40px 34px 34px;
  }

  .eyebrow {
    display: inline-block;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .12em;
    padding: 4px 10px;
    background: #000000;
    color: #ffffff;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: .01em;
    color: #000000;
  }

  .subhead {
    margin: 0 0 26px;
    font-size: 14px;
    color: #3c3c3c;
    line-height: 1.5;
  }

  .field {
    position: relative;
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
    color: #000000;
  }

  .field input,
  .field textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #000000;
    background: #ffffff;
    border: 2.5px solid #000000;
    padding: 12px 14px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    outline: none;
    transition: transform .12s cubic-bezier(.2,.9,.3,1.3), box-shadow .12s cubic-bezier(.2,.9,.3,1.3);
    box-shadow: 3px 3px 0 #000000;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: #9a9a9a;
  }

  .field input:focus,
  .field textarea:focus {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 #000000;
  }

  .field textarea {
    resize: vertical;
    min-height: 120px;
  }

  .row {
    display: flex;
    gap: 14px;
  }
  .row .field { flex: 1; margin-bottom: 18px; }

  @media (max-width: 480px) {
    .row { flex-direction: column; gap: 0; }
  }

  /* ================= SUBMIT BUTTON — same style as the CV button ================= */
  .pharma-btn {
    position: relative;
    display: inline-flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 8px;
    padding: 17px 28px;
    background: #ffffff;
    border: 3px solid #000000;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    cursor: pointer;
    box-shadow: 6px 6px 0 #000000;
    overflow: hidden;
    transition: transform .14s cubic-bezier(.2,.9,.3,1.3), box-shadow .14s cubic-bezier(.2,.9,.3,1.3);
  }
  .pharma-btn:hover {
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 #000000;
  }
  .pharma-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #000000;
  }

  .pharma-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 45%;
    height: 100%;
    background: #000000;
    transform: skewX(-20deg);
    z-index: 2;
    opacity: 0;
    pointer-events: none;
  }
  .pharma-btn:hover::before {
    animation: slash .38s cubic-bezier(.2,.7,.2,1) 1;
  }
  @keyframes slash {
    0%   { left: -60%; opacity: .9; }
    60%  { opacity: .9; }
    100% { left: 130%; opacity: 0; }
  }

  .btn-label {
    position: relative;
    z-index: 3;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #000000;
    transition: transform .12s ease;
  }
  .pharma-btn:hover .btn-label {
    animation: label-snap .3s steps(2, jump-none) 1;
  }
  @keyframes label-snap {
    0%   { transform: translateX(0); }
    30%  { transform: translateX(2px); }
    60%  { transform: translateX(-1px); }
    100% { transform: translateX(0); }
  }

  .plane-wrap {
    position: relative;
    z-index: 3;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    overflow: visible;
  }
  .plane-svg { width: 100%; height: 100%; display: block; }

  .pharma-btn:hover .plane-icon {
    animation: dart .9s cubic-bezier(.45,0,.2,1) infinite;
  }
  @keyframes dart {
    0%   { transform: translate(0,0) rotate(0deg);   opacity: 1; }
    38%  { transform: translate(5px,-4px) rotate(6deg); opacity: 1; }
    55%  { transform: translate(11px,-8px) rotate(6deg); opacity: 0; }
    56%  { transform: translate(-8px,7px) rotate(-2deg); opacity: 0; }
    75%  { transform: translate(-8px,7px) rotate(-2deg); opacity: 0; }
    100% { transform: translate(0,0) rotate(0deg); opacity: 1; }
  }

  .speed-line {
    opacity: 0;
    transform-origin: right center;
  }
  .pharma-btn:hover .speed-line {
    animation: speed .9s cubic-bezier(.45,0,.2,1) infinite;
  }
  .sl1 { animation-delay: 0s !important; }
  .sl2 { animation-delay: .07s !important; }
  .sl3 { animation-delay: .14s !important; }
  @keyframes speed {
    0%   { opacity: 0; transform: scaleX(.2); }
    38%  { opacity: .8; transform: scaleX(1); }
    55%  { opacity: 0; transform: scaleX(1.4); }
    100% { opacity: 0; transform: scaleX(.2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .plane-icon, .speed-line, .btn-label, .pharma-btn::before,
    .field input, .field textarea {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <div class="contact-panel">
    <span class="eyebrow">Contact</span>
    <h1>Me Contacter</h1>
    <p class="subhead">Une question, une opportunité, un projet ? Écrivez-moi ci-dessous.</p>

    <form action="https://formsubmit.co/ahmedjerbi02@gmail.com" method="POST" target="_blank">
      <!-- FormSubmit options -->
      <input type="hidden" name="_subject" value="Nouveau message depuis le site">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <div class="row">
        <div class="field">
          <label for="name">Nom complet</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required>
        </div>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
        </div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
      </div>

      <button class="pharma-btn" type="submit">
        <span class="plane-wrap">
          <svg class="plane-svg" viewBox="0 0 34 34" fill="none">
            <line class="speed-line sl1" x1="33" y1="9"  x2="25" y2="9"  stroke="#000000" stroke-width="2" stroke-linecap="round"/>
            <line class="speed-line sl2" x1="33" y1="15" x2="23" y2="15" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
            <line class="speed-line sl3" x1="33" y1="21" x2="26" y2="21" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

            <g class="plane-icon">
              <path d="M30 17 L4 6 L13 17 L4 28 Z" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M30 17 L13 17" stroke="#ffffff" stroke-width="1.5"/>
            </g>
          </svg>
        </span>

        <span class="btn-label">Envoyer le message</span>
      </button>
    </form>
  </div>

</body>
</html>
